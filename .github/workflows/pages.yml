name: Pages

on:
  push:
    branches:
      - main
  pull_request:
    paths:
      - "**/*.md"
      - "mkdocs.yml"
      - "requirements-pages.txt"
      - ".github/workflows/pages.yml"
      - ".github/check_pages_site.py"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12.10"

      - name: Install MkDocs
        run: python -m pip install --disable-pip-version-check --require-hashes --no-deps -r requirements-pages.txt

      - name: Collect public reader pages
        run: |
          mkdir -p pages-src
          ln -sfn ../README.md pages-src/README.md
          ln -sfn ../CHANGELOG.md pages-src/CHANGELOG.md
          ln -sfn ../LICENSE pages-src/LICENSE
          ln -sfn ../api pages-src/api
          ln -sfn ../architecture pages-src/architecture
          ln -sfn ../development pages-src/development
          ln -sfn ../docs pages-src/docs

      - name: Build the site
        run: mkdocs build --strict

      - name: Check the built site
        run: python .github/check_pages_site.py site

      - name: Setup Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@v5.0.0

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v3.0.1
        with:
          path: site

  deploy:
    needs: build
    if: github.event_name != 'pull_request'
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Deploy Pages
        id: deployment
        uses: actions/deploy-pages@v4.0.5
